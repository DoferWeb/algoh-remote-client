name: Build Algoh Support Client

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: 'Upload build artifacts'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master

jobs:
  build-algoh-support:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: ${{ inputs.upload-artifact == true || github.event_name == 'push' }}
      upload-tag: "1.4.9"
