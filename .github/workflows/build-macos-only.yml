name: Build Algoh Remote Client macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: macOS-${{ matrix.job.arch }}
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    env:
      RUST_VERSION: "1.75"
      FLUTTER_VERSION: "3.24.5"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
      VERSION: "2.0.0"
      UPLOAD_ARTIFACT: "true"
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              extra-build-args: "--screencapturekit",
              arch: arm64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install dependencies
        run: |
          brew install yasm create-dmg llvm
          # Install NASM 2.16 (compatible with multimedia libraries)
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm 2>/dev/null || true
          if [ -d "/opt/homebrew/bin" ]; then
            sudo cp nasm-2.16.03/nasm /opt/homebrew/bin/nasm 2>/dev/null || true
          fi
          nasm --version || true

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          if [ -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
            cd "$FLUTTER_ROOT"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}

      - name: Build macOS app
        run: |
          python3 -c "
          import re
          v = '12.3'
          def rep(path, pat, r):
              try:
                  with open(path, 'r') as f: c = f.read()
                  with open(path, 'w') as f: f.write(re.sub(pat, r, c))
              except Exception as e: print(f'{path}: {e}')
          rep('build.py', r'MACOSX_DEPLOYMENT_TARGET=[0-9.]+', f'MACOSX_DEPLOYMENT_TARGET={v}')
          rep('flutter/macos/Podfile', r'platform :osx, .[0-9.]*.', f'platform :osx, \'{v}\'')
          rep('Cargo.toml', r'osx_minimum_system_version = .[0-9.]*.', f'osx_minimum_system_version = \"{v}\"')
          rep('flutter/macos/Runner.xcodeproj/project.pbxproj', r'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;', f'MACOSX_DEPLOYMENT_TARGET = {v};')
          "
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create DMG
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG" || true
          APP_PATH=$(find flutter/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          create-dmg --window-size 800 400 --app-drop-link 600 185 Algoh-Support-macOS-${{ matrix.job.arch }}.dmg "$APP_PATH" || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Algoh-Support-macOS-${{ matrix.job.arch }}
          path: |
            *.dmg
            flutter/build/macos/Build/Products/Release/*.app
